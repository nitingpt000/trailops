name: ci

on:
  push:
    branches: [develop, master]
  pull_request:

# A newer push to the same branch cancels the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trailops
          POSTGRES_PASSWORD: trailops
          POSTGRES_DB: trailops_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U trailops" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - name: Migration from empty + downgrade round trip
        env:
          DATABASE_URL: postgresql+asyncpg://trailops:trailops@localhost:55432/trailops_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Integration tests against PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://trailops:trailops@localhost:55432/trailops_test
        run: uv run pytest -q
      - name: OpenAPI contract is up to date
        run: |
          uv run python -c "import json; from app.main import app; json.dump(app.openapi(), open('../../packages/contracts/openapi.json','w'), indent=1)"
          git diff --exit-code -- ../../packages/contracts/openapi.json

  web-and-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trailops/contracts typecheck
      - run: pnpm --filter @trailops/contracts test
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - name: Android debug build
        run: cd android && ./gradlew assembleDebug --no-daemon
